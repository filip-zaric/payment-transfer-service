micronaut.application.name=payment-transfer
micronaut.server.port=${PORT:8080}
micronaut.server.max-request-size=16KB
micronaut.security.authentication=bearer
micronaut.security.endpoints.login.enabled=false
micronaut.security.endpoints.logout.enabled=false
micronaut.security.token.jwt.signatures.secret.bank.secret=${JWT_SECRET}
micronaut.security.token.jwt.signatures.secret.bank.jws-algorithm=HS256
micronaut.security.token.jwt.claims-validators.issuer=${JWT_ISSUER:payment-issuer}
micronaut.security.token.jwt.claims-validators.audience=${JWT_AUDIENCE:payment-transfer}
datasources.default.url=${JDBC_URL:jdbc:postgresql://localhost:5432/payments}
datasources.default.username=${JDBC_USER:payments}
datasources.default.password=${JDBC_PASSWORD}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.maximum-pool-size=12
datasources.default.connection-timeout=5000
flyway.datasources.default.enabled=true
